<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя Онлайн Игра</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
        canvas { background: #111; border: 2px solid #555; }
        #info { position: absolute; top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div id="info">Управляй своей точкой с помощью <b>Стрелочек</b> или <b>WASD</b></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Подключаем клиентскую библиотеку Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let players = {};
        let myId = null;
        const speed = 5;
        const keys = {};

        // Запоминаем наш собственный ID, когда сервер присылает список
        socket.on('connect', () => { myId = socket.id; });

        socket.on('currentPlayers', (serverPlayers) => { players = serverPlayers; });
        socket.on('newPlayer', (data) => { players[data.id] = data.info; });
        socket.on('playerMoved', (data) => { if(players[data.id]) { players[data.id].x = data.x; players[data.id].y = data.y; } });
        socket.on('playerDisconnected', (id) => { delete players[id]; });

        // Отслеживаем нажатия клавиш
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function update() {
            if (!myId || !players[myId]) return;

            let moved = false;
            // Управление WASD или Стрелочки
            if (keys['a'] || keys['arrowleft'])  { players[myId].x -= speed; moved = true; }
            if (keys['d'] || keys['arrowright']) { players[myId].x += speed; moved = true; }
            if (keys['w'] || keys['arrowup'])    { players[myId].y -= speed; moved = true; }
            if (keys['s'] || keys['arrowdown'])  { players[myId].y += speed; moved = true; }

            // Ограничения границ экрана
            players[myId].x = Math.max(15, Math.min(canvas.width - 15, players[myId].x));
            players[myId].y = Math.max(15, Math.min(canvas.height - 15, players[myId].y));

            // Если мы сдвинулись, отправляем серверу наши новые координаты
            if (moved) {
                socket.emit('playerMovement', { x: players[myId].x, y: players[myId].y });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем всех игроков
            Object.keys(players).forEach(id => {
                const player = players[id];
                ctx.beginPath();
                ctx.arc(player.x, player.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = player.color;
                ctx.fill();
                ctx.closePath();

                // Выделяем своего игрока белой обводкой
                if (id === myId) {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
