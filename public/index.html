<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя Онлайн Игра с Чатом</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { background: #111; border: 2px solid #555; }
        #info { position: absolute; top: 10px; text-align: center; }
        
        /* Стили для блока чата */
        #chat-container { position: absolute; bottom: 20px; left: 20px; width: 300px; background: rgba(0, 0, 0, 0.7); border: 1px solid #555; padding: 10px; border-radius: 5px; display: flex; flex-direction: column; }
        #chat-messages { height: 180px; overflow-y: auto; margin-bottom: 5px; font-size: 14px; display: flex; flex-direction: column; }
        #chat-input { background: #333; border: 1px solid #555; color: white; padding: 5px; border-radius: 3px; outline: none; width: 100%; box-sizing: border-box; }
        .msg { margin-bottom: 4px; word-break: break-all; padding: 2px 4px; position: relative; }
        .msg.admin-del { cursor: pointer; color: #ff6666; font-size: 11px; float: right; margin-left: 8px; }
        .msg.admin-del:hover { color: #fff; }
        .msg.system { font-style: italic; color: #aaa; font-size: 13px; }
        .msg.private { border-left: 3px solid #ff9900; padding-left: 6px; background: rgba(255, 153, 0, 0.1); }

        /* Админ-бейдж */
        #admin-badge { position: absolute; top: 10px; left: 10px; background: #ff9800; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; display: none; z-index: 50; }

        /* Список игроков для личных сообщений (над чатом) */
        #players-list-container { margin-bottom: 6px; font-size: 13px; color: #ddd; }
        #players-list-title { font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        #players-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .player-item { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; user-select: none; transition: background 0.2s; }
        .player-item:hover { background: rgba(255,255,255,0.2); }
        .player-item.me { border-color: #4CAF50; background: rgba(76, 175, 80, 0.2); }
        .player-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }

        /* Кнопка удаления для админа — корзина */
        .msg.admin-del { cursor: pointer; color: #ff6666; font-size: 16px; float: right; margin-left: 8px; line-height: 1; }
        .msg.admin-del:hover { color: #fff; background: rgba(255,102,102,0.2); padding: 2px 4px; border-radius: 3px; }

        /* Оверлей ввода имени (не перекрывает поле полностью — видно игру сквозь него) */
        #name-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        #name-overlay input { padding: 10px; font-size: 16px; margin-top: 10px; border: none; border-radius: 4px; }
        #name-overlay button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
        #name-overlay button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="admin-badge">АДМИН</div>
    <div id="info">Управляй точкой: <b>Стрелочки / WASD</b>. Нажми <b>Enter</b>, чтобы писать в чат. Админ: <b>/admin пароль</b></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Окно чата поверх игры -->
    <div id="chat-container">
        <!-- Список игроков для личных сообщений -->
        <div id="players-list-container">
            <div id="players-list-title">
                <span>Игроки для ЛС:</span>
                <span id="players-count">0</span>
            </div>
            <div id="players-list"></div>
        </div>

        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Сообщение или /w Имя текст" maxlength="100">
    </div>

    <!-- Оверлей ввода имени при подключении -->
    <div id="name-overlay">
        <div style="font-size: 18px; margin-bottom: 10px;">Введите ваше имя:</div>
        <input type="text" id="name-input" maxlength="20" placeholder="Игрок">
        <button id="name-submit">Подтвердить</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const nameOverlay = document.getElementById('name-overlay');
        const nameInput = document.getElementById('name-input');
        const nameSubmit = document.getElementById('name-submit');
        const adminBadge = document.getElementById('admin-badge');
        const playersListEl = document.getElementById('players-list');
        const playersCountEl = document.getElementById('players-count');

        let players = {};
        let myId = null;
        let isAdmin = false;
        let isTypingName = true; // пока не ввели имя — движение заблокировано
        const speed = 5;
        const keys = {};
        let isTyping = false;

        // Оверлей ввода имени при подключении
        nameOverlay.style.display = 'flex';
        nameInput.focus();

        function submitName() {
            const name = nameInput.value.trim();
            if (!name) return;
            socket.emit('setName', name);
            nameOverlay.style.display = 'none';
            isTypingName = false; // разблокируем движение после ввода имени
        }

        nameSubmit.addEventListener('click', submitName);
        nameInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') submitName();
        });

        // Отрисовать список игроков для ЛС
        function renderPlayersList() {
            playersListEl.innerHTML = '';
            const ids = Object.keys(players);
            playersCountEl.textContent = ids.length;

            ids.forEach(id => {
                const p = players[id];
                if (!p) return;

                const item = document.createElement('div');
                item.classList.add('player-item');
                if (id === myId) item.classList.add('me');

                const dot = document.createElement('span');
                dot.classList.add('player-dot');
                dot.style.backgroundColor = p.color || '#fff';

                const name = document.createElement('span');
                name.textContent = p.name || `Игрок${id.substring(0,4)}`;
                if (id === myId) name.textContent += ' (вы)';

                item.appendChild(dot);
                item.appendChild(name);

                // Клик по игроку — вставить команду личного сообщения в чат
                item.addEventListener('click', () => {
                    const targetName = p.name || `Игрок${id.substring(0,4)}`;
                    chatInput.value = `/w ${targetName} `;
                    chatInput.focus();
                });

                playersListEl.appendChild(item);
            });
        }

        socket.on('connect', () => { myId = socket.id; });
        socket.on('adminStatus', (isAdminFlag) => {
            isAdmin = isAdminFlag;
            console.log('Админ-статус:', isAdmin);
            adminBadge.style.display = isAdmin ? 'block' : 'none';
        });
        socket.on('adminChanged', (newAdminId) => {
            isAdmin = (myId === newAdminId);
            adminBadge.style.display = isAdmin ? 'block' : 'none';
        });
        socket.on('currentPlayers', (serverPlayers) => { players = serverPlayers; renderPlayersList(); });
        socket.on('newPlayer', (data) => { players[data.id] = data.info; renderPlayersList(); });
        socket.on('playerRenamed', (data) => {
            if (players[data.id]) players[data.id].name = data.name;
            renderPlayersList();
        });
        socket.on('playerMoved', (data) => { if(players[data.id]) { players[data.id].x = data.x; players[data.id].y = data.y; } });
        socket.on('playerDisconnected', (id) => { delete players[id]; renderPlayersList(); });

        // История чата при подключении
        socket.on('chatHistory', (history) => {
            chatMessages.innerHTML = '';
            history.forEach(msg => appendMessageElement(msg));
        });
        // Прием публичных сообщений от сервера
        socket.on('chatMessageReceived', (data) => {
            appendMessageElement(data);
            while (chatMessages.children.length > 60) {
                chatMessages.removeChild(chatMessages.firstChild);
            }
        });

        // Прием личных сообщений
        socket.on('privateMessage', (data) => {
            const el = appendMessageElement(data, true);
            el.classList.add('private');
            if (data.monitored) {
                const marker = document.createElement('span');
                marker.style.cssText = 'float: right; font-size: 11px; color: #ff9800; margin-left: 8px; display: block;';
                marker.textContent = '👁️ прослушка';
                el.appendChild(marker);

                if (data.toName) {
                    const targetInfo = document.createElement('span');
                    targetInfo.style.cssText = 'float: right; font-size: 9px; color: #ffb74d; margin-left: 8px; margin-top: 1px; display: block;';
                    targetInfo.textContent = `получатель: ${data.toName}`;
                    el.appendChild(targetInfo);
                }
            }
        });

        // Удаление сообщения админом
        socket.on('messageDeleted', (data) => {
            const el = chatMessages.querySelector(`[data-message-id="${data.messageId}"]`);
            if (el) el.remove();
        });

        function escapeHtml(text) {
            if (!text) return text;
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function appendMessageElement(data, isPrivate = false) {
            const div = document.createElement('div');
            div.classList.add('msg');
            div.setAttribute('data-message-id', data.id);
            if (data.system) div.classList.add('system');

            const senderName = data.fromName || 'Система';
            let html = `<span style="color: ${data.color || '#fff'}; font-weight: bold;">[${senderName}]:</span> ${escapeHtml(data.text)}`;

            if (isAdmin && !data.system && data.fromId !== 'system') {
                html += ` <span class="admin-del" title="Удалить сообщение #${data.id}">🗑️</span>`;
            }

            div.innerHTML = html;

            if (isAdmin && !data.system && data.fromId !== 'system') {
                const delBtn = div.querySelector('.admin-del');
                delBtn.addEventListener('click', () => {
                    socket.emit('chatMessage', `/delete ${data.id}`);
                });
            }

            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }


        // Отслеживание клавиатуры
        window.addEventListener('keydown', e => {
            // Если вводим имя
            if (isTypingName) {
                if (e.key === 'Enter') {
                    submitName();
                }
                return;
            }

            // Если пишем в чат
            if (isTyping) {
                if (e.key === 'Enter') {
                    // Отправляем сообщение
                    isTyping = false;
                    const text = chatInput.value.trim();
                    if (text !== '') {
                        socket.emit('chatMessage', text);
                    }
                    chatInput.value = '';
                    chatInput.blur();
                    canvas.focus();
                }
                return;
            }

            // Обычный игровой режим
            if (e.key === 'Enter') {
                // Включаем режим ввода текста
                isTyping = true;
                chatInput.focus();
                return;
            }

            // Запоминаем физическую клавишу (работает на любой раскладке, включая русскую)
            keys[e.code] = true;
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        function update() {
            if (!myId || !players[myId] || isTyping || isTypingName) return;

            let moved = false;
            if (keys['KeyA'] || keys['ArrowLeft'])  { players[myId].x -= speed; moved = true; }
            if (keys['KeyD'] || keys['ArrowRight']) { players[myId].x += speed; moved = true; }
            if (keys['KeyW'] || keys['ArrowUp'])    { players[myId].y -= speed; moved = true; }
            if (keys['KeyS'] || keys['ArrowDown'])  { players[myId].y += speed; moved = true; }

            players[myId].x = Math.max(15, Math.min(canvas.width - 15, players[myId].x));
            players[myId].y = Math.max(15, Math.min(canvas.height - 15, players[myId].y));

            if (moved) {
                socket.emit('playerMovement', { x: players[myId].x, y: players[myId].y });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            Object.keys(players).forEach(id => {
                const player = players[id];
                ctx.beginPath();
                ctx.arc(player.x, player.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = player.color;
                ctx.fill();
                ctx.closePath();

                if (id === myId) {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
